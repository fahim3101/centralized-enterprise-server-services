!
version 12.2(37)SE1
no service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
!
hostname core-01
banner motd ^AUTHORIZED ACCESS ONLY - Centralized Enterprise Server Services | core-01 | HQ core layer 1 - HSRP active, DHCP server, OSPF^
enable secret 5 $1$Centr4l1z3d$Lab0nly$ChangeMe2026
!
!
no profinet
!
!
ip dhcp excluded-address 192.168.10.1 192.168.10.20
ip dhcp excluded-address 192.168.10.252 192.168.10.254
ip dhcp excluded-address 192.168.11.1 192.168.11.20
ip dhcp excluded-address 192.168.11.252 192.168.11.254
ip dhcp excluded-address 192.168.12.1 192.168.12.20
ip dhcp excluded-address 192.168.12.252 192.168.12.254
ip dhcp excluded-address 192.168.13.1 192.168.13.20
ip dhcp excluded-address 192.168.13.252 192.168.13.254
ip dhcp excluded-address 192.168.14.1 192.168.14.20
ip dhcp excluded-address 192.168.14.252 192.168.14.254
ip dhcp excluded-address 192.168.15.1 192.168.15.20
ip dhcp excluded-address 192.168.15.252 192.168.15.254
ip dhcp excluded-address 192.168.16.1 192.168.16.20
ip dhcp excluded-address 192.168.16.252 192.168.16.254
!
ip dhcp pool SALES
 range 192.168.10.21 192.168.10.251
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.254
 dns-server 172.10.10.2
!
ip dhcp pool HR
 range 192.168.11.21 192.168.11.251
 network 192.168.11.0 255.255.255.0
 default-router 192.168.11.254
 dns-server 172.10.10.2
!
ip dhcp pool ACCOUNTS
 range 192.168.12.21 192.168.12.251
 network 192.168.12.0 255.255.255.0
 default-router 192.168.12.254
 dns-server 172.10.10.2
!
ip dhcp pool BRANCH1
 range 192.168.13.21 192.168.13.251
 network 192.168.13.0 255.255.255.0
 default-router 192.168.13.254
 dns-server 172.10.10.2
!
ip dhcp pool BRANCH2
 range 192.168.14.21 192.168.14.251
 network 192.168.14.0 255.255.255.0
 default-router 192.168.14.254
 dns-server 172.10.10.2
!
ip dhcp pool BRANCH3
 range 192.168.15.21 192.168.15.251
 network 192.168.15.0 255.255.255.0
 default-router 192.168.15.254
 dns-server 172.10.10.2
!
ip dhcp pool BRANCH4
 range 192.168.16.21 192.168.16.251
 network 192.168.16.0 255.255.255.0
 default-router 192.168.16.254
 dns-server 172.10.10.2
!
!
!
ip routing
!
!
!
!
!
!
!
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/1
 switchport trunk allowed vlan 10-12,20
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet0/2
 switchport trunk allowed vlan 10-12,20
 switchport trunk encapsulation dot1q
 switchport mode trunk
!
interface FastEthernet0/3
 description uplink to EDGE-RTR (10.3.3.0/24)
 no switchport
 ip address 10.3.3.1 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet0/4
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 description Server1 - DNS 172.10.10.2
 switchport access vlan 20
 switchport mode access
!
interface FastEthernet0/5
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 description Server0 - WEB 172.10.10.1
 switchport access vlan 20
 switchport mode access
!
interface FastEthernet0/6
 spanning-tree portfast
 spanning-tree bpduguard enable
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation shutdown
 description Server2 - MAIL 172.10.10.3
 switchport access vlan 20
 switchport mode access
!
interface FastEthernet0/7
!
interface FastEthernet0/8
!
interface FastEthernet0/9
!
interface FastEthernet0/10
!
interface FastEthernet0/11
!
interface FastEthernet0/12
!
interface FastEthernet0/13
!
interface FastEthernet0/14
!
interface FastEthernet0/15
!
interface FastEthernet0/16
!
interface FastEthernet0/17
