!
version 12.4
no service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
!
hostname BR4-WAN-RTR
banner motd ^AUTHORIZED ACCESS ONLY - Centralized Enterprise Server Services | BR4-WAN-RTR | Branch 4 WAN router - IPsec peer^
enable secret 5 $1$Centr4l1z3d$Lab0nly$ChangeMe2026
!
!
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
!
crypto isakmp key VPN123 address 8.1.1.1
!
!
!
crypto ipsec transform-set VPN-SET esp-aes esp-sha-hmac
!
crypto map VPN-MAP 10 ipsec-isakmp
 set peer 8.1.1.1
 set transform-set VPN-SET
 match address 140
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 description uplink to BR4-ACCESS (4.1.1.0/24)
 ip address 4.1.1.1 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet0/1
 no ip address
 duplex auto
 speed auto
 shutdown
!
interface Serial1/0
 description IPsec tunnel to HQ-WAN-RTR (8.1.1.0/24)
 ip address 8.1.1.2 255.255.255.0
 crypto map VPN-MAP
!
interface Serial1/1
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial1/2
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial1/3
 no ip address
 clock rate 2000000
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 log-adjacency-changes
 network 8.1.1.0 0.0.0.255 area 0
 network 4.1.1.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
access-list 140 permit ip 192.168.16.0 0.0.0.255 192.168.10.0 0.0.0.255
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
