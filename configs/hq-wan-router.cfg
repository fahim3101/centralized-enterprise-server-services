!
version 12.4
no service timestamps log datetime msec
no service timestamps debug datetime msec
service password-encryption
!
hostname HQ-WAN-RTR
banner motd ^AUTHORIZED ACCESS ONLY - Centralized Enterprise Server Services | HQ-WAN-RTR | HQ WAN edge - OSPF area 0 and IPsec hub^
enable secret 5 $1$Centr4l1z3d$Lab0nly$ChangeMe2026
!
!
!
!
!
!
!
!
no ip cef
no ipv6 cef
!
!
!
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 2
!
crypto isakmp key VPN123 address 5.1.1.2
crypto isakmp key VPN123 address 6.1.1.2
crypto isakmp key VPN123 address 7.1.1.2
crypto isakmp key VPN123 address 8.1.1.2
!
!
!
crypto ipsec transform-set VPN-SET esp-aes esp-sha-hmac
!
crypto map VPN-MAP 10 ipsec-isakmp
 set peer 5.1.1.2
 set transform-set VPN-SET
 match address 110
!
!
crypto map VPN-B2 10 ipsec-isakmp
 set peer 6.1.1.2
 set transform-set VPN-SET
 match address 120
!
!
crypto map VPN-B3 10 ipsec-isakmp
 set peer 7.1.1.2
 set transform-set VPN-SET
 match address 130
!
!
crypto map VPN-B4 10 ipsec-isakmp
 set peer 8.1.1.2
 set transform-set VPN-SET
 match address 140
!
!
!
!
!
!
!
!
spanning-tree mode pvst
!
!
!
!
!
!
interface FastEthernet0/0
 description uplink to CORE-01 (10.1.1.0/24)
 ip address 10.1.1.2 255.255.255.0
 duplex auto
 speed auto
!
interface FastEthernet0/1
 description uplink to CORE-02 (10.2.2.0/24)
 ip address 10.2.2.1 255.255.255.0
 duplex auto
 speed auto
!
interface Serial1/0
 description IPsec tunnel to BR1-WAN-RTR (5.1.1.0/24)
 ip address 5.1.1.1 255.255.255.0
 clock rate 2000000
 crypto map VPN-MAP
!
interface Serial1/1
 description IPsec tunnel to BR2-WAN-RTR (6.1.1.0/24)
 ip address 6.1.1.1 255.255.255.0
 clock rate 2000000
 crypto map VPN-B2
!
interface Serial1/2
 description IPsec tunnel to BR3-WAN-RTR (7.1.1.0/24)
 ip address 7.1.1.1 255.255.255.0
 clock rate 2000000
 crypto map VPN-B3
!
interface Serial1/3
 description IPsec tunnel to BR4-WAN-RTR (8.1.1.0/24)
 ip address 8.1.1.1 255.255.255.0
 clock rate 2000000
 crypto map VPN-B4
!
interface Serial1/4
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial1/5
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial1/6
 no ip address
 clock rate 2000000
 shutdown
!
interface Serial1/7
 no ip address
 clock rate 2000000
 shutdown
!
interface Vlan1
 no ip address
 shutdown
!
router ospf 1
 log-adjacency-changes
 network 10.1.1.0 0.0.0.255 area 0
 network 5.1.1.0 0.0.0.255 area 0
 network 6.1.1.0 0.0.0.255 area 0
 network 7.1.1.0 0.0.0.255 area 0
 network 8.1.1.0 0.0.0.255 area 0
 network 10.2.2.0 0.0.0.255 area 0
!
ip classless
!
ip flow-export version 9
!
!
access-list 110 permit ip 192.168.10.0 0.0.0.255 192.168.13.0 0.0.0.255
access-list 120 permit ip 192.168.10.0 0.0.0.255 192.168.14.0 0.0.0.255
access-list 130 permit ip 192.168.10.0 0.0.0.255 192.168.15.0 0.0.0.255
access-list 140 permit ip 192.168.10.0 0.0.0.255 192.168.16.0 0.0.0.255
!
!
!
!
!
!
line con 0
!
line aux 0
!
line vty 0 4
 login
!
!
!
end
